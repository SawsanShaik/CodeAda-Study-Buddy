<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <h1>Canvas Calendar</h1>
    <div class="actions">
      <button id="refresh" title="Refresh">↻</button>
      <button id="settings" title="Settings">⚙</button>
    </div>
  </header>

  <section id="setup" hidden>
    <p>Paste your Canvas calendar feed URL:</p>
    <ol>
      <li>Open <a href="https://canvas.illinois.edu/calendar" target="_blank">Canvas Calendar</a></li>
      <li>Click <b>Calendar Feed</b> at the bottom right</li>
      <li>Copy the link and paste it here</li>
    </ol>
    <input id="feedUrl" type="url" placeholder="https://canvas.illinois.edu/feeds/calendars/user_….ics" />
    <button id="save" class="primary">Save</button>
    <p id="setupError" class="error"></p>
  </section>

  <section id="main" hidden>
    <button id="openPlanner" class="primary wide">Plan my day ↗</button>
    <div class="filters">
      <button data-range="7" class="active">This week</button>
      <button data-range="30">30 days</button>
      <label><input type="checkbox" id="assignmentsOnly" checked /> Assignments only</label>
    </div>
    <p id="error" class="error"></p>
    <div id="list"></div>
    <footer id="updated"></footer>
  </section>

  <script type="module" src="popup.js"></script>
</body>
</html>
