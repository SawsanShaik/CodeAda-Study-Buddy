<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Plan my day</title>
  <link rel="stylesheet" href="planner.css" />
</head>
<body>
  <header>
    <div>
      <h1>Plan my day</h1>
      <p id="today" class="sub"></p>
    </div>
    <button id="toggleSettings" class="ghost">⚙ Gemini settings</button>
  </header>

  <section id="settings" class="card" hidden>
    <h2>Gemini settings</h2>
    <p class="muted">Get a free API key at <a href="https://aistudio.google.com/apikey" target="_blank">aistudio.google.com/apikey</a>. It's stored only in this browser.</p>
    <div class="row">
      <label>API key <input id="apiKey" type="password" placeholder="AIza…" /></label>
      <label>Model <input id="model" type="text" placeholder="auto" title="Leave as auto to use the newest Gemini Flash model" /></label>
      <button id="saveSettings" class="primary">Save</button>
    </div>
  </section>

  <main>
    <div class="col">
      <section class="card">
        <h2>1. Pick what you'll work on today</h2>
        <p class="muted">Upcoming Canvas assignments for the next two weeks, by class.</p>
        <div id="assignments"></div>
      </section>

      <section class="card">
        <h2>2. Add your own tasks</h2>
        <form id="addTask" class="row">
          <input id="taskTitle" placeholder="e.g. Review lecture notes" required />
          <input id="taskCourse" placeholder="Class (optional)" />
          <input id="taskAmount" placeholder="How much? (optional)" />
          <select id="taskMinutes"></select>
          <button class="primary">Add</button>
        </form>
        <div id="manualList"></div>
      </section>
    </div>

    <div class="col">
      <section class="card">
        <h2>3. Make the schedule</h2>
        <div class="row">
          <label>Start <input id="dayStart" type="time" /></label>
          <label>End <input id="dayEnd" type="time" /></label>
          <label>Breaks <select id="breakStyle"></select></label>
        </div>
        <label class="stack">Anything else? <textarea id="notes" rows="2" placeholder="e.g. gym at 5, I focus best in the morning"></textarea></label>
        <p id="selectedSummary" class="muted"></p>
        <button id="generate" class="primary wide">Make my schedule with Gemini</button>
        <p id="status" class="muted"></p>
      </section>

      <section class="card" id="scheduleCard" hidden>
        <h2>Today's schedule</h2>
        <p id="scheduleSummary" class="summary"></p>
        <ol id="schedule"></ol>
      </section>
    </div>
  </main>

  <script type="module" src="planner.js"></script>
</body>
</html>
